; GTA 6 phone replica - generic content renderer for the ESP32-2432S028R ("CYD").
; Two display variants are built; flash the one whose hardware test screen
; shows the colour bars correctly (see README).

[platformio]
default_envs = ili9341, st7789

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
; The CH340 on this board corrupts data at high baud rates behind a USB hub.
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.1.16
    bblanchon/ArduinoJson@7.2.1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Iinclude
    -Isrc
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
build_src_filter = +<*> -<.git/>

[env:ili9341]
build_flags = ${env.build_flags} -DPANEL_ILI9341=1

[env:st7789]
build_flags = ${env.build_flags} -DPANEL_ST7789=1
